# Linter Python : erreurs réelles seulement (syntaxe, noms indéfinis, redéfinitions, formats).
line-length = 200
target-version = "py39"
extend-exclude = [".venv", "private", "logs", "data"]

[lint]
select = ["E701", "E702", "E703", "E9", "F401", "F5", "F6", "F7", "F82", "F811", "F841"]

[lint.per-file-ignores]
# Les tests réimportent les fixtures pytest (`world`, `server`) : ce n'est pas une redéfinition fautive.
"tests/**" = ["F811"]

[format]
# Formatage sans réécriture massive : guillemets conservés, lignes longues tolérées (les lignes ne sont découpées que pour séparer les instructions condensées).
quote-style = "preserve"
skip-magic-trailing-comma = false
