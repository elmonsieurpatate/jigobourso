<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splits à vérifier — Jigobourso</title><link rel="stylesheet" href="assets/app.css?v=__BUILD__"><link rel="stylesheet" href="assets/splits.css?v=__BUILD__"></head>
<body><main class="wrap split-review"><header class="page-head"><div><h1>Splits à vérifier</h1><p>Un saut de cours ne prouve pas un split. Examinez les informations, puis décidez.</p></div><button class="btn" id="sr-scan">Détecter les nouveaux cas</button></header>
<p class="notice" id="sr-feedback" role="status" aria-live="polite" hidden></p>
<div class="sr-toolbar"><form id="sr-search"><label class="sr-only" for="sr-query">Rechercher un titre ou un ISIN</label><input type="search" id="sr-query" placeholder="Titre, symbole ou ISIN…"><button class="btn" type="submit">Rechercher</button></form><div class="sr-controls"><label>Trier par<select id="sr-sort"><option value="magnitude_desc">Plus gros ratios</option><option value="magnitude_asc">Plus petits ratios</option><option value="recent">Plus récents</option></select></label><label>Amplitude minimum<select id="sr-min-ratio"><option value="1">Toutes</option><option value="2">≥ ×2 / ÷2</option><option value="5">≥ ×5 / ÷5</option><option value="10">≥ ×10 / ÷10</option><option value="100">≥ ×100 / ÷100</option></select></label></div><button class="btn" id="sr-refresh">Actualiser</button></div>
<nav class="sr-tabs" id="sr-tabs" aria-label="Statut des splits"></nav><p id="sr-summary" class="small muted"></p><p id="sr-recompute" class="notice" hidden>Recalcul des performances demandé. Les graphiques utilisent l’événement confirmé ; les notes seront actualisées à la fin du calcul. <a href="admin.html#logs">Voir les traitements</a></p>
<div id="sr-rows" aria-live="polite"><div class="empty"><span class="spinner"></span> Chargement…</div></div><nav id="sr-pages" class="sr-pages" aria-label="Pages"></nav>
</main><script src="assets/app.js?v=__BUILD__"></script><script src="assets/splits.js?v=__BUILD__"></script></body></html>
