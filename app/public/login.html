<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Jigobourso</title><link rel="stylesheet" href="assets/app.css?v=202610281803"></head>
<body><main class="wrap" style="max-width:440px;padding-top:9vh">
<div class="brand" style="font-size:1.6rem;margin-bottom:6px">Jigobourso</div>
<p class="muted" style="margin-top:0">Trouvez les actions et ETF dont la hausse est solide, et suivez vos portefeuilles.</p>
<div class="card"><div class="tabs" id="tabs"><button class="on" data-t="in">Connexion</button><button data-t="up" id="up-tab" hidden>Inscription</button></div>
<form id="in" class="grid">
  <label class="field">Identifiant<input id="u" autocomplete="username" required autofocus></label>
  <label class="field">Mot de passe<input id="p" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" style="justify-content:center">Se connecter</button></form>
<form id="up" class="grid" hidden>
  <label class="field">Identifiant<input id="nu" autocomplete="username" required pattern="[A-Za-z0-9_.\-]{3,30}"></label>
  <label class="field">Mot de passe (10 caractères minimum)<input id="np" type="password" autocomplete="new-password" required minlength="10"></label>
  <label class="field">Mot d’invitation<input id="nc" required></label>
  <button class="btn primary" style="justify-content:center">Créer mon compte</button></form>
<div id="msg" class="notice err" hidden style="margin-top:12px"></div></div></main>
<script src="assets/app.js?v=202610281803"></script><script>
const next = new URLSearchParams(location.search).get('next');
const safeNext = next && /^[a-z]+\.html(\?[^\s]*)?$/i.test(next) ? next : 'index.html';
const msg = t => { const m = J.$('#msg'); m.textContent = t; m.hidden = !t; };
J.api('auth/me').then(r => { if (r.user) location.href = safeNext; J.$('#up-tab').hidden = !r.registration_open; });
J.$$('#tabs button').forEach(b => b.onclick = () => { J.$$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); J.$('#in').hidden = b.dataset.t !== 'in'; J.$('#up').hidden = b.dataset.t !== 'up'; msg(''); });
J.$('#in').onsubmit = async e => { e.preventDefault(); try { await J.post('auth/login', { username: J.$('#u').value, password: J.$('#p').value }); location.href = safeNext; } catch (x) { msg(x.message); } };
J.$('#up').onsubmit = async e => { e.preventDefault(); try { await J.post('auth/register', { username: J.$('#nu').value, password: J.$('#np').value, code: J.$('#nc').value }); await J.post('auth/login', { username: J.$('#nu').value, password: J.$('#np').value }); location.href = 'index.html'; } catch (x) { msg(x.message); } };
</script></body></html>
