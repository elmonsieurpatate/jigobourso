<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Jigobourso</title><script src="assets/theme-init.js?v=__BUILD__"></script><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="stylesheet" href="assets/base.css?v=__BUILD__"><link rel="stylesheet" href="assets/admin-columns.css?v=__BUILD__"><link rel="stylesheet" href="assets/admin-scores.css?v=__BUILD__"><link rel="stylesheet" href="assets/halo.css?v=__BUILD__"></head>
<body><main class="wrap admin-page"><header class="page-head"><div><span class="page-kicker">ESPACE TECHNIQUE</span><h1>Administration</h1><p>Gérez les sources, les filtres, les traitements et les comptes depuis un même espace.</p></div></header>
<div id="page"><div class="empty"><span class="spinner"></span></div></div></main>
<template id="admin-fdb-template">
  <div id="runbar" class="notice" data-style="display:none"></div>
  <div class="admin-flow-intro"><div><span class="page-kicker">SOURCE DE DONNÉES</span><h2>FinanceDatabase</h2><p>Importez le catalogue, choisissez les titres à conserver, puis transmettez le résultat à Yahoo Finance.</p></div><div class="admin-flow-steps"><span>01 · Importer</span><span>02 · Filtrer</span><span>03 · Vérifier</span></div></div>
  <div class="admin-flow">
    <section class="card admin-stage admin-import" aria-labelledby="fdb-import-title"><header class="admin-stage-head"><span class="admin-stage-number">01</span><div><h2 id="fdb-import-title">Importer le catalogue</h2><p>Les données brutes sont conservées pour pouvoir changer les filtres sans nouveau téléchargement.</p></div></header><div class="admin-stage-body admin-import-grid"><div id="fdb-import-info"></div><div class="admin-action-panel"><div id="fdb-import-job"></div><button class="btn primary" id="go-import">Importer FinanceDatabase</button></div></div></section>
    <section class="card admin-stage admin-filter" aria-labelledby="fdb-filter-title"><header class="admin-stage-head"><span class="admin-stage-number">02</span><div><h2 id="fdb-filter-title">Définir les filtres</h2><p>Choisissez les règles, puis lancez le filtrage pour appliquer ces réglages.</p></div></header><div class="admin-stage-body"><p class="admin-filter-status" id="fdb-filter-status"></p><div class="admin-filter-layout"><div id="fdb-filter-form" class="admin-filter-form"></div><aside class="admin-filter-aside"><h3>Règles permanentes</h3><details id="fdb-technical"><summary>Voir les règles techniques</summary><div id="fdb-technical-list"></div></details><p>Les valeurs sont modifiables avant chaque filtrage. Aucun changement n’est appliqué tant que vous ne cliquez pas sur « Filtrer ».</p></aside></div><div class="admin-stage-actions"><button class="btn primary" id="go-filter">Filtrer les titres</button><button class="btn" id="go-reset">Valeurs par défaut</button></div></div></section>
    <section class="card admin-stage admin-results" aria-labelledby="fdb-results-title"><header class="admin-stage-head"><span class="admin-stage-number">03</span><div><h2 id="fdb-results-title">Vérifier le résultat</h2><p>Consultez les titres conservés et les exclusions à chaque étape.</p></div></header><div class="admin-stage-body"><div id="fdb-results"></div><p id="fdb-next" class="admin-next-step"></p></div></section>
    <div id="explain"></div>
  </div>
</template>
