<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — Jigobourso</title><link rel="stylesheet" href="assets/app.css?v=202611080400"></head><body><main class="wrap auth-wrap"><div class="card" id="box">
<h1>Créer un compte</h1><p class="muted">Jigobourso aide à trier et comparer des actions et ETF. Il ne donne aucun conseil d’achat.</p>
<form id="register" class="grid" novalidate>
<label class="field">Pseudo<input id="name" autocomplete="username" required maxlength="30" aria-describedby="h-name"><small id="h-name" class="muted">3 à 30 caractères : lettres, chiffres, _ . -</small></label>
<label class="field">Adresse e-mail<input id="email" type="email" autocomplete="email" required maxlength="190" aria-describedby="h-email"><small id="h-email" class="muted">Un e-mail de bienvenue y sera envoyé ; elle sert aussi à récupérer votre mot de passe.</small></label>
<label class="field">Mot de passe<input id="p" type="password" minlength="10" autocomplete="new-password" required aria-describedby="h-p"><small id="h-p" class="muted">10 caractères minimum.</small></label>
<label class="field">Mot d’invitation<input id="code" required autocomplete="off" aria-describedby="h-code"><small id="h-code" class="muted">Communiqué par l’administrateur de Jigobourso.</small></label>
<div id="err" class="notice warn" role="alert" hidden></div>
<button class="btn primary" id="go">Créer mon compte</button>
</form>
<p><a href="login.html">J’ai déjà un compte : me connecter</a></p>
</div></main>
<script src="assets/app.js?v=202611080400"></script><script src="assets/passwords.js?v=202611080400"></script><script src="assets/register.js?v=202611080400"></script></body></html>
