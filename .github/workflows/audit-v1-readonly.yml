name: Audit V1 — lecture seule Hostinger
on:
  push:
    branches: [audit/v1-readonly-20261104]
    paths: [.github/workflows/audit-v1-readonly.yml]
permissions:
  contents: write
jobs:
  read_sources:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Lire et chiffrer les sources sans écriture Hostinger
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          RECIPIENT_CERT: 
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/v1-audit"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/v1-audit/ssh.key"
          printf '%s' "$RECIPIENT_CERT" | base64 -d > "$RUNNER_TEMP/v1-audit/recipient.pem"
          printf '%s\n' '[147.79.103.168]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr7QtJ399JQsqSyH2cDwi5RUdPt5VVTateWLrGAKuVE' > "$RUNNER_TEMP/v1-audit/known_hosts"
          ssh -F /dev/null -p 65002 -i "$RUNNER_TEMP/v1-audit/ssh.key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o UserKnownHostsFile="$RUNNER_TEMP/v1-audit/known_hosts" -o ConnectTimeout=20 u381524662@147.79.103.168 'python3 -B -' <<'REMOTE' | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out "$RUNNER_TEMP/v1-audit/sources.cms" "$RUNNER_TEMP/v1-audit/recipient.pem"
          import os, pathlib, tarfile, json, io, hashlib
          root=pathlib.Path.home()/'domains/bourse.turnjoy.dev'
          if not root.is_dir():raise SystemExit('Domaine V1 introuvable')
          excluded={'.git','.venv','venv','node_modules','private','data','logs','cache','__pycache__','backups','backup','vendor','sessions','uploads'}
          extensions={'.py','.php','.js','.ts','.html','.css','.md'}
          forbidden={'config.php','config.py','db.php','database.php','secrets.py','credentials.py','env.php','settings_local.py'}
          manifest=[];total=0
          with tarfile.open(fileobj=__import__('sys').stdout.buffer,mode='w|gz') as archive:
              for parent,dirs,files in os.walk(root,followlinks=False):
                  dirs[:]=sorted(d for d in dirs if d not in excluded and not d.startswith('.') and not pathlib.Path(parent,d).is_symlink())
                  for name in sorted(files):
                      p=pathlib.Path(parent,name)
                      if p.is_symlink() or name.startswith('.') or name.lower() in forbidden:continue
                      if p.suffix.lower() not in extensions and name not in ('requirements.txt','package.json'):continue
                      size=p.stat().st_size
                      if size>2_000_000:continue
                      total+=size
                      if total>30_000_000:raise SystemExit('Volume de sources supérieur à la limite de sûreté')
                      content=p.read_bytes();relative=str(p.relative_to(root))
                      info=tarfile.TarInfo(relative);info.size=len(content);info.mode=0o600
                      archive.addfile(info,io.BytesIO(content))
                      manifest.append({'path':relative,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
              raw=json.dumps({'root':str(root),'files':manifest},indent=2).encode()
              info=tarfile.TarInfo('AUDIT_MANIFEST.json');info.size=len(raw);info.mode=0o600;archive.addfile(info,io.BytesIO(raw))
          REMOTE
      - name: Publier uniquement le résultat chiffré dans Git
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/v1-result"
          cd "$RUNNER_TEMP/v1-result"
          git init -q
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$AUDIT_RESULT" = success ]; then cp "$RUNNER_TEMP/v1-audit/sources.cms" sources.cms; fi
          python3 - <<'PYTHON'
          import json,os,pathlib
          pathlib.Path('status.json').write_text(json.dumps({'status':os.environ['AUDIT_RESULT'],'commit':os.environ['GITHUB_SHA'],'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']},indent=2))
          PYTHON
          git add .
          git commit -qm 'Résultat chiffré audit V1 en lecture seule'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push -q "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/audit/v1-sources-encrypted-20261104
      - name: Retirer la clé SSH temporaire du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/v1-audit/ssh.key"
