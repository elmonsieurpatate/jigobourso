name: Validation PR sans déploiement
# Même recette que main (workflows réutilisables), sans accès à la production ni écriture dans le dépôt.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true # un nouveau commit rend la validation du précédent inutile ; aucun déploiement n'est concerné
jobs:
  syntax:
    name: Contrôles courts
    uses: ./.github/workflows/quality.yml
  tests:
    name: Tests complets
    uses: ./.github/workflows/tests.yml
