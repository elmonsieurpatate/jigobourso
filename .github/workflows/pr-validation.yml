name: Validation PR sans déploiement
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-test-only
          MARIADB_DATABASE: jigobourso_it
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JIGO_TEST_DATABASE: '1'
      JIGO_DB_HOST: 127.0.0.1
      JIGO_DB_PORT: '3306'
      JIGO_DB_NAME: jigobourso_it
      JIGO_DB_USER: root
      JIGO_DB_PASSWORD: local-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.9'
      - name: Tests financiers, API et migrations sur base jetable
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
          scripts/validate_quality.sh
          scripts/test_suite.sh fast
          MYSQL_PWD=local-test-only mysql -h127.0.0.1 -uroot jigobourso_it < db/schema.sql
          scripts/test_suite.sh integ
      - name: Même recette navigateur que main
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/financial-browser" --no-save playwright-core@1.56.1 > /dev/null
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/financial-browser/node_modules/playwright-core" JIGO_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          export JIGO_TEST_MAIL_DIR="$RUNNER_TEMP/account-mail" JIGO_E2E_RESULTS="$PWD/audit-results"
          scripts/e2e_browser.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr-browser
          path: audit-results/
          retention-days: 1
