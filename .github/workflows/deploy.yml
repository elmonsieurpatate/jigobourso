name: Jigobourso V2 — tests puis déploiement Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: diagnostic (lecture seule), deploy, ou rollback (restaure la dernière sauvegarde du code)
        type: choice
        options: [diagnostic, deploy, rollback]
        default: diagnostic
permissions:
  contents: read
concurrency:
  group: hostinger-jigobourso-production
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-test-only
          MARIADB_DATABASE: jigobourso_it
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Dépendances
        run: python -m pip install -r requirements.txt pytest
      - name: Syntaxe PHP et Python
        run: |
          set -euo pipefail
          find app scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          python scripts/migrate.py --check
          python -m compileall -q engine scripts
      - name: Tests rapides
        run: python -m pytest tests/fast -q
      - name: Tests d'intégration (base jetable du runner)
        env:
          JIGO_TEST_DATABASE: "1"
          JIGO_DB_HOST: 127.0.0.1
          JIGO_DB_PORT: "3306"
          JIGO_DB_NAME: jigobourso_it
          JIGO_DB_USER: root
          JIGO_DB_PASSWORD: local-test-only
        run: |
          set -euo pipefail
          MYSQL_PWD=local-test-only mysql -h127.0.0.1 -uroot jigobourso_it < db/schema.sql
          python -m pytest tests/integ -q
  hostinger:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write # met à jour la branche deployment-status (compte rendu sans secret)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurer SSH
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$RUNNER_TEMP/jigobourso-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/jigobourso-ssh/key"
          chmod 600 "$RUNNER_TEMP/jigobourso-ssh/key"
          printf '%s\n' '[147.79.103.168]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr7QtJ399JQsqSyH2cDwi5RUdPt5VVTateWLrGAKuVE' > "$RUNNER_TEMP/jigobourso-ssh/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/jigobourso-ssh/known_hosts" | grep -F 'SHA256:fh14KGbEYreksPS6ughPoyn+M4caidDfVZrVAHG1OzM'
      - name: Diagnostic ou déploiement
        env:
          OPERATION: ${{ inputs.operation || 'deploy' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ops/deploy.sh "$OPERATION" > "$RUNNER_TEMP/jigobourso-deploy.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            STATUS=in_progress bash ops/report-status.sh || true
            sleep 30
          done
          result=0
          wait "$pid" || result=$?
          tail -n 120 "$RUNNER_TEMP/jigobourso-deploy.log"
          exit "$result"
      - name: Publier le résultat
        if: always()
        env:
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: bash ops/report-status.sh
      - name: Retirer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/jigobourso-ssh/key"
