name: Jigobourso — déploiement Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: diagnostic (lecture seule), deploy, ou rollback (restaure la dernière sauvegarde du code)
        type: choice
        options: [diagnostic, deploy, rollback]
        default: diagnostic
      validation:
        description: full = tests complets ; quick = déploiement rapide avec contrôles essentiels
        type: choice
        options: [full, quick]
        default: full
permissions:
  contents: read
concurrency:
  group: hostinger-jigobourso-production
  cancel-in-progress: false
jobs:
  syntax:
    name: Contrôles courts
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Syntaxe PHP, Python, JavaScript et migrations additives
        run: |
          set -euo pipefail
          find app scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          python scripts/migrate.py --check
          python -m compileall -q engine scripts
          for file in app/public/assets/*.js; do node --check "$file"; done
  tests:
    name: Tests complets
    needs: syntax
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[deploy quick]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && inputs.validation != 'quick')
    permissions: {contents: write}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-test-only
          MARIADB_DATABASE: jigobourso_it
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Dépendances
        run: python -m pip install -r requirements.txt pytest
      - name: Tests rapides
        run: |
          set -euo pipefail
          python -m pytest tests/fast -q --tb=no | tee "$RUNNER_TEMP/jigobourso-deploy.log"
      - name: Tests d'intégration (base jetable du runner)
        env:
          JIGO_TEST_DATABASE: "1"
          JIGO_DB_HOST: 127.0.0.1
          JIGO_DB_PORT: "3306"
          JIGO_DB_NAME: jigobourso_it
          JIGO_DB_USER: root
          JIGO_DB_PASSWORD: local-test-only
        run: |
          set -euo pipefail
          MYSQL_PWD=local-test-only mysql -h127.0.0.1 -uroot jigobourso_it < db/schema.sql
          timeout 240s python -m pytest tests/integ -q --tb=no | tee -a "$RUNNER_TEMP/jigobourso-deploy.log"
      - name: Browser financial smoke (isolated synthetic database)
        env: {JIGO_TEST_DATABASE: '1', JIGO_DB_HOST: 127.0.0.1, JIGO_DB_PORT: '3306', JIGO_DB_NAME: jigobourso_it, JIGO_DB_USER: root, JIGO_DB_PASSWORD: local-test-only}
        run: |
          set -euo pipefail
          mkdir -p audit-results
          PYTHONPATH="$PWD" python tests/e2e/account_seed.py
          php scripts/create_user.php review_user review-local-password --admin --email=review@example.test > /dev/null
          php scripts/create_user.php plain_user plain-local-password --email=plain@example.test > /dev/null
          PYTHONPATH="$PWD" python tests/e2e/etf_seed.py
          export JIGO_PYTHON="$(command -v python)" JIGO_ENGINE_ROOT="$PWD"
          npm install --prefix "$RUNNER_TEMP/financial-browser" --no-save playwright-core@1.56.1 > /dev/null
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/financial-browser/node_modules/playwright-core" JIGO_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          export JIGO_TEST_MAIL_DIR="$RUNNER_TEMP/account-mail"
          install -d -m 700 "$JIGO_TEST_MAIL_DIR"
          php -S 127.0.0.1:18089 -t app/public > audit-results/php-server.log 2>&1 &
          php_pid=$!
          show() { for f in audit-results/browser.log audit-results/account-browser.log audit-results/strategies-ui.log audit-results/php-server.log; do [ -f "$f" ] && echo "::error title=$f::$(grep -v ' 200 \| Accepted\| Closing\| \[200\]' "$f" | tail -c 1400 | tr '\n' '|')"; done; true; }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then show; fi; kill "$php_pid"' EXIT      # les journaux ne sont affichés qu'en cas d'échec
          node tests/e2e/financial.cjs > audit-results/browser.log 2>&1
          timeout 240s node tests/e2e/strategies-ui.cjs > audit-results/strategies-ui.log 2>&1      # avant account-navigation : celui-ci provoque des échecs de connexion volontaires qui bloquent les connexions suivantes
          timeout 180s node tests/e2e/account-navigation.cjs > audit-results/account-browser.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: financial-browser
          path: audit-results/
          retention-days: 1
      - name: Publish verification result before deployment
        if: always()
        env:
          STATUS: tests_${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f audit-results/account-browser.json ]; then cat audit-results/account-browser.json >> "$RUNNER_TEMP/jigobourso-deploy.log"; fi
          bash ops/report-status.sh
  hostinger:
    needs: [syntax, tests]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.syntax.result == 'success' &&
      (needs.tests.result == 'success' ||
       (needs.tests.result == 'skipped' &&
        ((github.event_name == 'workflow_dispatch' && (inputs.operation != 'deploy' || inputs.validation == 'quick')) ||
         (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy quick]')))))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write # met à jour la branche deployment-status (compte rendu sans secret)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Indiquer le mode demandé
        env:
          OPERATION: ${{ inputs.operation || 'deploy' }}
          VALIDATION: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy quick]')) && 'quick' || inputs.validation || 'full' }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          printf '### Opération : %s\n\nValidation : `%s` · Tests complets : `%s`\n' "$OPERATION" "$VALIDATION" "$TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Configurer SSH
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$RUNNER_TEMP/jigobourso-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/jigobourso-ssh/key"
          chmod 600 "$RUNNER_TEMP/jigobourso-ssh/key"
          printf '%s\n' '[147.79.103.168]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr7QtJ399JQsqSyH2cDwi5RUdPt5VVTateWLrGAKuVE' > "$RUNNER_TEMP/jigobourso-ssh/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/jigobourso-ssh/known_hosts" | grep -F 'SHA256:fh14KGbEYreksPS6ughPoyn+M4caidDfVZrVAHG1OzM'
      - name: Diagnostic ou déploiement
        env:
          OPERATION: ${{ inputs.operation || 'deploy' }}
          JIGO_DEPLOY_VALIDATION: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy quick]')) && 'quick' || inputs.validation || 'full' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ops/deploy.sh "$OPERATION" > "$RUNNER_TEMP/jigobourso-deploy.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            STATUS=in_progress bash ops/report-status.sh || true
            sleep 30
          done
          result=0
          wait "$pid" || result=$?
          # Le journal d'Actions est public avec le dépôt : seules les lignes d'étapes et de verdict sont affichées (ops/public-log.sh).
          bash ops/public-log.sh < "$RUNNER_TEMP/jigobourso-deploy.log"
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: financial-preservation
          path: |
            ${{ runner.temp }}/etf-*.json
            ${{ runner.temp }}/financial-*.json
            ${{ runner.temp }}/account-*.json
          retention-days: 1
      - name: Publier le résultat
        if: always()
        env:
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: bash ops/report-status.sh
      - name: Retirer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/jigobourso-ssh/key"
