name: Diagnostic privé des anciens portefeuilles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Diagnostic limité en lecture seule
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/inspection-key" "$RUNNER_TEMP/inspection.json" "$RUNNER_TEMP/inspection-error.log"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/inspection-key"
          printf '%s\n' '[147.79.103.168]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr7QtJ399JQsqSyH2cDwi5RUdPt5VVTateWLrGAKuVE' > "$RUNNER_TEMP/inspection-hosts"
          ssh -F /dev/null -p 65002 -i "$RUNNER_TEMP/inspection-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/inspection-hosts" -o ConnectTimeout=20 u381524662@147.79.103.168 'cd /home/u381524662/domains/jigobourso.turnjoy.dev/jigobourso-v2 && php' < scripts/release/inspect_legacy_portfolios.php > "$RUNNER_TEMP/inspection.json" 2> "$RUNNER_TEMP/inspection-error.log" || { echo 'Diagnostic interrompu ; aucune donnée financière publiée dans les logs.'; exit 1; }
          cat "$RUNNER_TEMP/inspection.json"
          echo 'Diagnostic terminé : uniquement des booléens, aucun montant ni transaction exporté.'
