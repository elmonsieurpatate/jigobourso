name: Navigation and account verification
on:
  push:
    branches: [feat/navigation-account]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env: {MARIADB_ROOT_PASSWORD: local-test-only, MARIADB_DATABASE: jigobourso_it}
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.9'}
      - name: Test isolated runner, never production
        env: {JIGO_TEST_DATABASE: '1', JIGO_DB_HOST: 127.0.0.1, JIGO_DB_PORT: '3306', JIGO_DB_NAME: jigobourso_it, JIGO_DB_USER: root, JIGO_DB_PASSWORD: local-test-only}
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python -m pip install -r requirements.txt pytest > audit-results/install.log 2>&1
          find app scripts -name '*.php' -print0 | xargs -0 -n1 php -l > audit-results/php.log 2>&1
          for file in app/public/assets/*.js tests/e2e/*.mjs; do node --check "$file"; done > audit-results/js.log 2>&1
          python scripts/migrate.py --check > audit-results/migrations.log 2>&1
          python -m pytest tests/fast -q > audit-results/fast.log 2>&1; echo "$?" > audit-results/fast.exit
          MYSQL_PWD=local-test-only mysql -h127.0.0.1 -uroot jigobourso_it < db/schema.sql
          python -m pytest tests/integ -q > audit-results/integ.log 2>&1; echo "$?" > audit-results/integ.exit
      - name: Browser financial smoke (isolated synthetic database)
        env: {JIGO_TEST_DATABASE: '1', JIGO_DB_HOST: 127.0.0.1, JIGO_DB_PORT: '3306', JIGO_DB_NAME: jigobourso_it, JIGO_DB_USER: root, JIGO_DB_PASSWORD: local-test-only}
        run: |
          set -euo pipefail
          mkdir -p audit-results
          PYTHONPATH="$PWD" python tests/e2e/account_seed.py
          php scripts/create_user.php review_user review-local-password --admin --email=review@example.test > /dev/null
          export JIGO_PYTHON="$(command -v python)" JIGO_ENGINE_ROOT="$PWD"
          npm install --prefix "$RUNNER_TEMP/financial-browser" --no-save playwright-core@1.56.1 > /dev/null
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/financial-browser/node_modules/playwright-core" JIGO_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          export JIGO_TEST_MAIL_DIR="$RUNNER_TEMP/account-mail"
          install -d -m 700 "$JIGO_TEST_MAIL_DIR"
          php -S 127.0.0.1:18089 -t app/public > audit-results/php-server.log 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"' EXIT
          node tests/e2e/financial.cjs > audit-results/browser.log 2>&1
          node tests/e2e/account-navigation.cjs > audit-results/account-browser.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: financial-tests, path: audit-results/, retention-days: 3}
  remote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read-only SSH and anonymous HTTP
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p audit-results
          install -d -m 700 "$RUNNER_TEMP/review-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/review-ssh/key"
          chmod 600 "$RUNNER_TEMP/review-ssh/key"
          printf '%s\n' '[147.79.103.168]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr7QtJ399JQsqSyH2cDwi5RUdPt5VVTateWLrGAKuVE' > "$RUNNER_TEMP/review-ssh/known_hosts"
          ssh -F /dev/null -p 65002 -i "$RUNNER_TEMP/review-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/review-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 u381524662@147.79.103.168 'cd /home/u381524662/domains/jigobourso.turnjoy.dev/jigobourso-v2 && set -a && . ./private/env && set +a && php' < <(sed "s@__DIR__ . '/../app/lib/db.php'@getcwd() . '/app/lib/db.php'@" scripts/check_financial_integrity.php) > audit-results/integrity.json
          ssh -F /dev/null -p 65002 -i "$RUNNER_TEMP/review-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/review-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 u381524662@147.79.103.168 'cd /home/u381524662/domains/jigobourso.turnjoy.dev/jigobourso-v2 && set -a && . ./private/env && set +a && JIGO_SEND_MAIL_PROBE=1 php' < scripts/account_preflight.php > audit-results/mail-preflight.json
          ssh -F /dev/null -p 65002 -i "$RUNNER_TEMP/review-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/review-ssh/known_hosts" -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 u381524662@147.79.103.168 'cd /home/u381524662/domains/jigobourso.turnjoy.dev/jigobourso-v2 && set -a && . ./private/env && set +a && PYTHONPATH=$PWD .venv/bin/python -B -' < scripts/explain_current_ranking.py > audit-results/ranking.json
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/review-ssh/key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: financial-remote, path: audit-results/, retention-days: 3}
  report:
    needs: [tests, remote]
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: financial-*, path: downloaded, merge-multiple: true}
      - name: Publish evidence on separate audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cp -r downloaded/. "$dir/"
          cd "$dir"
          git init -q
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch -q origin account-status && git reset --soft FETCH_HEAD || true
          printf '{"commit":"%s","run_url":"https://github.com/%s/actions/runs/%s","tests":"%s","remote":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" '${{ needs.tests.result }}' '${{ needs.remote.result }}' > status.json
          git add .
          git commit -qm 'Account verification results'
          git push -q origin HEAD:account-status
