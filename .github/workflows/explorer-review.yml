name: Explorer — validation PR sans déploiement
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-test-only
          MARIADB_DATABASE: jigobourso_it
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      JIGO_TEST_DATABASE: '1'
      JIGO_DB_HOST: 127.0.0.1
      JIGO_DB_PORT: '3306'
      JIGO_DB_NAME: jigobourso_it
      JIGO_DB_USER: root
      JIGO_DB_PASSWORD: local-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.9'
      - name: Tests financiers, API et migrations sur base jetable
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest
          find app scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          python scripts/migrate.py --check
          python -m compileall -q engine scripts
          for file in app/public/assets/*.js tests/e2e/*.cjs; do node --check "$file"; done
          python -m pytest tests/fast -q
          MYSQL_PWD=local-test-only mysql -h127.0.0.1 -uroot jigobourso_it < db/schema.sql
          python -m pytest tests/integ -q
      - name: Navigateurs ordinateur et mobiles — données synthétiques
        run: |
          set -euo pipefail
          mkdir -p audit-results
          export JIGO_PYTHON="$(command -v python)" JIGO_ENGINE_ROOT="$PWD"
          npm install --prefix "$RUNNER_TEMP/browser" --no-save playwright-core@1.56.1 > /dev/null
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright-core"
          export JIGO_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          PYTHONPATH="$PWD" python tests/e2e/explorer-reconstruction-seed.py
          php -S 127.0.0.1:18091 -t app/public > audit-results/php.log 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"' EXIT
          BASE=http://127.0.0.1:18091 SHOTS=audit-results node tests/e2e/explorer-reconstruction.cjs
          node tests/e2e/explorer-url.cjs
          BASE=http://127.0.0.1:18091 SHOTS=audit-results/growth node tests/e2e/growth-v4.cjs
          python -m scripts.compare_growth_v4 --snapshot audit-results/growth/market-snapshot.json --json > audit-results/growth/snapshot-comparison.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: explorer-review-browser
          path: audit-results
